# Final Unlock Script
source [find interface/stlink.cfg]
source [find target/stm32f1x.cfg]

# Initialize the connection and halt the CPU
init
halt

# Step 1: Disable Read Protection (RDP)
echo "--> Attempting to disable Read Protection..."
stm32f1x unlock 0

# Step 2: Disable Write Protection (WRP)
echo "--> Attempting to disable Write Protection..."
flash protect 0 0 15 off

# Step 3: Verify the result immediately
echo "--> Reading option bytes to verify the change..."
stm32f1x options_read 0

echo "--> Script finished. Check the output above for RDP: 0xAA."
shutdown
